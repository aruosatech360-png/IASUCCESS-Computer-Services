<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Request Service — IASUCCESS</title>
  <meta name="description" content="Request a service from IASUCCESS Computer Services." />
  <meta name="theme-color" content="#1F2937" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root{ --primary-dark: #1F2937; --accent-red: #DC2626; --bg-light: #F7F9FB; }
    .glass { background: rgba(255,255,255,0.7); backdrop-filter: blur(6px); }
    .hero-wave{ background: linear-gradient(180deg, rgba(31,41,55,0.95) 0%, rgba(34,197,94,0.02) 100%), url('cmp6.jpg') center/cover no-repeat; background-attachment: fixed; }
    .flyer-img{ object-fit: contain; }
    @media (max-width:768px){ .hero-wave{ background-attachment: scroll; padding:2rem 0; } }

    /* Modal animation */
    #successModal.flex {
      animation: modalPop 0.5s cubic-bezier(.68,-0.55,.27,1.55);
    }
    @keyframes modalPop {
      0% { opacity: 0; transform: scale(0.8); }
      80% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="antialiased text-[var(--primary-dark)] bg-[var(--bg-light)] font-sans">

  <!-- Header (small) -->
  <header class="bg-white shadow sticky top-0 z-50">
    <div class="container mx-auto px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-3">
          <img src="Iasuccess logo.jpg" alt="IASUCCESS logo" class="w-12 h-12 rounded-md object-cover shadow-sm" />
          <div>
            <h1 class="font-extrabold text-lg" style="color:var(--primary-dark)">IASUCCESS</h1>
            <p class="text-xs font-semibold text-[var(--accent-red)]">GLOBAL SERVICES</p>
          </div>
        </a>
      </div>
      <div class="text-sm">
        <a href="index.html" class="text-[var(--primary-dark)] underline">Back to Home</a>
      </div>
    </div>
  </header>

  <main class="py-12">
    <div class="container mx-auto px-6 max-w-2xl">
      <h2 class="text-3xl font-bold mb-2">Request a Service</h2>
      <p class="text-gray-600 mb-6">Choose a service and send your request directly to our WhatsApp. If you prefer email, use the email button.</p>

      <form id="requestForm" class="grid gap-4 bg-white p-6 rounded-lg shadow">
        <input type="hidden" name="access_key" value="bb617f81-75ba-4d48-aae9-3f00ddb1bd3b" />
        
        <label class="flex flex-col">
          <span class="text-sm font-semibold">Your name</span>
          <input name="name" type="text" required class="mt-1 p-3 rounded-md border" placeholder="Full name (letters only)" />
          <span id="nameError" class="text-xs text-red-600 mt-1 hidden"></span>
        </label>

        <label class="flex flex-col">
          <span class="text-sm font-semibold">Phone number</span>
          <input name="phone" type="tel" required class="mt-1 p-3 rounded-md border" placeholder="e.g. +234 906 217 0267 or 09062170267" title="Enter a valid phone number with country code" />
          <span id="phoneError" class="text-xs text-red-600 mt-1 hidden"></span>
        </label>

        <label class="flex flex-col">
          <span class="text-sm font-semibold">Email</span>
          <input name="email" type="email" required class="mt-1 p-3 rounded-md border" placeholder="you@example.com" />
          <span id="emailError" class="text-xs text-red-600 mt-1 hidden"></span>
        </label>

        <label class="flex flex-col">
          <span class="text-sm font-semibold">Service</span>
          <select name="service" id="serviceSelect" required class="mt-1 p-3 rounded-md border">
            <option value="">Choose a service...</option>
            <option>Typing & Printing</option>
            <option>Photocopy</option>
            <option>Scanning & Laminating</option>
            <option>Instant Passport Photograph</option>
            <option>Business Registration (CAC)</option>
            <option>NECO & WAEC GCE Registration</option>
            <option>NIN Services</option>
            <option>JAMB & Admissions</option>
            <option>International Passport Processing</option>
            <option>Internet Related Services</option>
            <option>Computer Training</option>
          </select>
          <span id="serviceError" class="text-xs text-red-600 mt-1 hidden"></span>
        </label>

        <label class="flex flex-col">
          <span class="text-sm font-semibold">Message</span>
          <textarea name="message" rows="4" required class="mt-1 p-3 rounded-md border" placeholder="Tell us about your service request..."></textarea>
          <span id="messageError" class="text-xs text-red-600 mt-1 hidden"></span>
        </label>

        <div class="flex gap-3">
          <button id="sendWhatsApp" type="button" class="flex-1 bg-green-600 text-white px-4 py-3 rounded-md font-semibold hover:bg-green-700">Send via WhatsApp</button>
          <button id="sendEmail" type="submit" class="flex-1 bg-[var(--accent-red)] text-white px-4 py-3 rounded-md font-semibold hover:opacity-95">Send via Email</button>
        </div>

        <p id="notice" class="text-sm text-green-600 mt-2 hidden"></p>
      </form>

      <!-- Success modal -->
      <div id="successModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-lg max-w-md w-full p-6 mx-4">
          <h3 class="text-xl font-bold mb-2">Request Sent</h3>
          <p id="successText" class="text-gray-700 mb-4">We opened WhatsApp for you. If it didn't open, use the button below.</p>
          <div class="flex gap-3">
            <a id="openWhatsAppAgain" href="#" target="_blank" class="flex-1 bg-[var(--accent-red)] text-white px-4 py-2 rounded-md text-center">Open WhatsApp</a>
            <button id="sendAnother" class="flex-1 border px-4 py-2 rounded-md">Send Another</button>
          </div>
          <div class="mt-3 text-sm text-center">
            <a href="index.html" class="text-[var(--primary-dark)] underline">Back to Home</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // render icons
    if (typeof lucide !== 'undefined') lucide.createIcons();

    // helper to read query param
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    // Validation functions
    function isValidEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    function isValidPhone(phone) {
      // Remove all spaces, dashes, parentheses
      const cleaned = phone.replace(/[\s\-().]/g, '');
      
      // Must start with + or contain country code
      const hasCountryCode = phone.includes('+') || /^234\d{10}$/.test(cleaned) || /^09\d{10}$/.test(cleaned);
      
      if (!hasCountryCode) return false;
      
      // Must have at least 10 digits
      const digitCount = cleaned.replace(/\D/g, '').length;
      return digitCount >= 10;
    }

    function isValidName(name) {
      const trimmed = name.trim();
      return trimmed.length >= 2 && /^[a-zA-Z\s'-]+$/.test(trimmed);
    }

    function validateForm(formData) {
      const errors = {};
      
      const name = formData.get('name');
      if (!isValidName(name)) {
        errors.name = 'Name must be at least 2 characters and contain only letters.';
      }
      
      const phone = formData.get('phone');
      if (!isValidPhone(phone)) {
        errors.phone = 'Phone must be valid with country code (e.g., +234 or 0234 format).';
      }
      
      const email = formData.get('email');
      if (email && !isValidEmail(email)) {
        errors.email = 'Please enter a valid email address.';
      }
      
      const service = formData.get('service');
      if (!service) {
        errors.service = 'Please select a service.';
      }
      
      const message = formData.get('message');
      const msgTrimmed = (message || '').trim();
      if (!msgTrimmed || msgTrimmed.length < 5) {
        errors.message = 'Message must be at least 5 characters.';
      }
      
      return errors;
    }

    function displayErrors(errors) {
      // Clear previous errors
      document.querySelectorAll('[id$="Error"]').forEach(el => el.classList.add('hidden'));
      
      // Display new errors
      Object.keys(errors).forEach(field => {
        const errorEl = document.getElementById(`${field}Error`);
        if (errorEl) {
          errorEl.textContent = errors[field];
          errorEl.classList.remove('hidden');
        }
      });
    }

    function clearErrors() {
      document.querySelectorAll('[id$="Error"]').forEach(el => el.classList.add('hidden'));
    }

    const whatsappNumber = '2349062170267';
    const form = document.getElementById('requestForm');
    const select = document.getElementById('serviceSelect');
    const notice = document.getElementById('notice');

    // Prefill service if provided in querystring
    const pre = getQueryParam('service');
    if (pre) {
      const decoded = decodeURIComponent(pre);
      for (const opt of select.options) {
        if (opt.value === decoded || opt.text === decoded) { opt.selected = true; break; }
      }
    }

    function openWhatsAppMessage(text) {
      const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
      return url;
    }

    // modal helpers
    const successModal = document.getElementById('successModal');
    const successText = document.getElementById('successText');
    const openWhatsAppAgain = document.getElementById('openWhatsAppAgain');
    const sendAnother = document.getElementById('sendAnother');

    let modalTimeout;
    function showSuccess(message, waUrl) {
      successText.textContent = message;
      if (waUrl) openWhatsAppAgain.setAttribute('href', waUrl);
      successModal.classList.remove('hidden');
      successModal.classList.add('flex');
      clearTimeout(modalTimeout);
      modalTimeout = setTimeout(()=>{
        hideSuccess();
      }, 4000);
    }

    function hideSuccess() {
      successModal.classList.add('hidden');
      successModal.classList.remove('flex');
      clearTimeout(modalTimeout);
    }

    // Send via WhatsApp
    document.getElementById('sendWhatsApp').addEventListener('click', ()=>{
      const formData = new FormData(form);
      const errors = validateForm(formData);
      
      if (Object.keys(errors).length > 0) {
        displayErrors(errors);
        return;
      }
      
      clearErrors();
      const name = formData.get('name');
      const phone = formData.get('phone');
      const email = formData.get('email') || 'Not provided';
      const service = formData.get('service');
      const message_text = formData.get('message');
      const message = `Service Request\n\nName: ${name}\nPhone: ${phone}\nEmail: ${email}\nService: ${service}\nMessage: ${message_text}`;
      const waUrl = openWhatsAppMessage(message);
      showSuccess('✓ Opening WhatsApp for you...', waUrl);
      form.reset();
      if (pre) select.value = pre;
    });

    // Send via Email (Web3Forms)
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      
      const formData = new FormData(form);
      const errors = validateForm(formData);
      
      if (Object.keys(errors).length > 0) {
        displayErrors(errors);
        return;
      }
      
      clearErrors();
      const name = formData.get('name');
      const phone = formData.get('phone');
      const email = formData.get('email');
      const service = formData.get('service');
      const message_text = formData.get('message');

      // Prepare data for Web3Forms
      const submitData = new FormData();
      submitData.append('access_key', 'bb617f81-75ba-4d48-aae9-3f00ddb1bd3b');
      submitData.append('name', name);
      submitData.append('email', email);
      submitData.append('phone', phone);
      submitData.append('service', service);
      submitData.append('message', message_text);
      submitData.append('from_name', 'IASUCCESS Service Request');

      try {
        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          body: submitData
        });

        const result = await response.json();
        
        if (result.success) {
          showSuccess(`✓ Email sent successfully! We'll get back to you soon at ${email}.`);
          form.reset();
          if (pre) select.value = pre;
        } else {
          showSuccess(`✓ Request submitted! If email fails, check your inbox or contact us via WhatsApp.`);
          form.reset();
          if (pre) select.value = pre;
        }
      } catch (error) {
        console.error('Error:', error);
        showSuccess(`✓ Your request was recorded. We'll contact you at ${phone} or ${email} shortly.`);
        form.reset();
        if (pre) select.value = pre;
      }
    });

    // modal actions
    sendAnother.addEventListener('click', ()=>{
      hideSuccess();
      form.querySelector('[name="name"]').focus();
    });

    // close modal when clicking outside content
    successModal.addEventListener('click', (e)=>{
      if (e.target === successModal) hideSuccess();
    });
  </script>
</body>
</html>
